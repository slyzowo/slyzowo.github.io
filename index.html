<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slyzowo.github.io</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#github">GitHub</a>
      <a href="#contact">Contact</a>
    </nav>

    <!-- Introduction & About Me -->
    <section>
      <div class="bubble" id="home">
        <h1>Home</h1>
        <p>Thank you for coming by!</p>
      </div>
    </section>

    <!-- About Me-->
    <section>
      <div class="container">
        <div class="bubble" id="about">
          <h1>About Me</h1>
          <p>
            I am a high school graduate and currently a student at The Tech
            Academy.
          </p>
        </div>

        <!-- GitHub -->
        <div class="bubble" id="github">
          <h1>GitHub</h1>
          <p>
            I have experience with C, C++, Java, Python, HTML, CSS, and
            Minecraft Datapacks
          </p>
          <a href="#github">My GitHub</a>
        </div>
      </div>
    </section>

    <!-- Contact Me! -->
    <section>
      <div class="bubble" id="contact">
        <h1>Contact Me!</h1>
        <form>
          <input
            type="text"
            minlength="3"
            name="first_name"
            placeholder="First Name"
          />
          <input
            type="text"
            minlength="3"
            name="last_name"
            placeholder="Last Name"
          />
          <input type="email" placeholder="email@email.com" />
          <br />
          <textarea placeholder="Type in your message here!"></textarea>
          <br />
          <input type="reset" name="reset" />
          <input type="submit" name="submit" />
        </form>
      </div>
    </section>
  </body>
</html>
